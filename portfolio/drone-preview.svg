<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#14110f"/>
  <rect x="0" y="0" width="600" height="36" fill="#000"/>
  <circle cx="20" cy="18" r="5" fill="#ff6a1a"/>
  <circle cx="38" cy="18" r="5" fill="#3a3530"/>
  <circle cx="56" cy="18" r="5" fill="#3a3530"/>

  <!-- video feed background -->
  <rect x="20" y="52" width="560" height="300" rx="8" fill="#1c1815" stroke="#3a3530"/>

  <!-- sky/ground gradient hint -->
  <rect x="20" y="52" width="560" height="180" fill="#241f1a"/>
  <rect x="20" y="232" width="560" height="120" fill="#181410"/>

  <!-- security zone polygon -->
  <polygon points="120,320 480,320 440,120 160,120" fill="none" stroke="#ff6a1a" stroke-width="2" stroke-dasharray="8 6" opacity="0.8"/>
  <text x="128" y="312" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ff6a1a">SECURITY ZONE</text>

  <!-- drone bounding box -->
  <rect x="270" y="150" width="90" height="60" fill="none" stroke="#ff6a1a" stroke-width="2.5"/>
  <rect x="270" y="138" width="86" height="16" fill="#ff6a1a"/>
  <text x="276" y="150" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#14110f">DRONE 96%</text>
  <!-- drone icon -->
  <circle cx="300" cy="180" r="4" fill="#fff"/>
  <circle cx="330" cy="180" r="4" fill="#fff"/>
  <line x1="300" y1="180" x2="330" y2="180" stroke="#fff" stroke-width="2"/>
  <line x1="315" y1="180" x2="315" y2="170" stroke="#fff" stroke-width="2"/>

  <!-- alert banner -->
  <rect x="20" y="360" width="560" height="30" rx="6" fill="#ff6a1a"/>
  <text x="36" y="380" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#14110f">⚠ ALERT — Drone detected inside restricted zone</text>

  <!-- top-left readouts -->
  <text x="36" y="72" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8a8378">FPS: 29.7</text>
  <text x="130" y="72" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8a8378">MODEL: YOLOv5</text>
  <text x="240" y="72" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ff6a1a">● LIVE</text>
</svg>
