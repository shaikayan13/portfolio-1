<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#fbfaf8"/>
  <rect x="0" y="0" width="600" height="36" fill="#14110f"/>
  <circle cx="20" cy="18" r="5" fill="#ff6a1a"/>
  <circle cx="38" cy="18" r="5" fill="#ece7e0"/>
  <circle cx="56" cy="18" r="5" fill="#ece7e0"/>

  <!-- assistant bubble -->
  <circle cx="70" cy="86" r="22" fill="#ff6a1a"/>
  <path d="M70 76 L73 83 L80 86 L73 89 L70 96 L67 89 L60 86 L67 83 Z" fill="#fff"/>
  <rect x="104" y="60" width="330" height="56" rx="16" fill="#ffffff" stroke="#ece7e0"/>
  <text x="122" y="83" font-family="Poppins, sans-serif" font-size="13.5" fill="#14110f">Hi! I'm your StudyBuddy AI —</text>
  <text x="122" y="102" font-family="Poppins, sans-serif" font-size="13.5" fill="#14110f">ask me anything about your syllabus.</text>

  <!-- user message -->
  <rect x="230" y="132" width="330" height="46" rx="16" fill="#ff6a1a"/>
  <text x="250" y="160" font-family="Poppins, sans-serif" font-size="14" fill="#fff">Explain gradient descent simply</text>

  <!-- assistant response block -->
  <circle cx="70" cy="216" r="22" fill="#ff6a1a"/>
  <path d="M70 206 L73 213 L80 216 L73 219 L70 226 L67 219 L60 216 L67 213 Z" fill="#fff"/>
  <rect x="104" y="192" width="410" height="94" rx="16" fill="#ffffff" stroke="#ece7e0"/>
  <text x="122" y="216" font-family="Poppins, sans-serif" font-size="13" fill="#14110f">Think of it like walking downhill in fog —</text>
  <text x="122" y="236" font-family="Poppins, sans-serif" font-size="13" fill="#14110f">you take small steps toward lower ground</text>
  <text x="122" y="256" font-family="Poppins, sans-serif" font-size="13" fill="#14110f">(lower error) until you reach the bottom.</text>
  <rect x="122" y="266" width="90" height="18" rx="9" fill="#fff1e8"/>
  <text x="132" y="279" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#c94e0c">ML basics</text>

  <!-- input bar -->
  <rect x="40" y="336" width="480" height="46" rx="23" fill="#ffffff" stroke="#ece7e0"/>
  <text x="60" y="365" font-family="Poppins, sans-serif" font-size="14" fill="#5b5650">Ask a study question...</text>
  <circle cx="530" cy="359" r="16" fill="#14110f"/>
  <path d="M524 359 l12 0 M532 353 l6 6 l-6 6" stroke="#fff" stroke-width="2" fill="none"/>
</svg>
